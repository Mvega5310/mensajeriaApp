<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Operador · Entregar con PIN</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&amp;family=Atkinson+Hyperlegible+Next:wght@400;500;700;800&amp;family=IBM+Plex+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0}
.pt{--bg:#F4F6F9;--surface:#FFFFFF;--raised:#E9EEF5;--line:#C7D0DA;--ink:#13294B;--muted:#4A5872;--action:#1E63C9;--on-action:#FFFFFF;--edge:#0C2E73;--pin:#0C2E73;--wa:#0F7A40;--on-wa:#FFFFFF;--gift:#C2410C;--warn:#8A5A00;--danger:#B42318;--brand:#17B6C4;font-family:'Atkinson Hyperlegible Next',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.pt.noche{--bg:#12151B;--surface:#1A1F28;--raised:#232A36;--line:#364152;--ink:#E6EAF0;--muted:#A6B0C0;--action:#86A9F0;--on-action:#0B1630;--edge:#0B0E13;--pin:#C7D0DA;--wa:#3DBE7A;--on-wa:#062414;--gift:#F0A06A;--warn:#E2B85C;--danger:#F08A80;--brand:#4FB8C1}
.h{font-family:Archivo,sans-serif;font-weight:800;letter-spacing:-0.02em}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.key{min-height:60px;border-radius:14px;border:0;background:var(--surface);color:var(--ink);font:700 26px 'IBM Plex Mono',monospace;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cell{width:64px;height:76px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700;box-sizing:border-box}
.tab{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:700 13px 'Atkinson Hyperlegible Next',sans-serif;color:var(--muted);text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--action);outline-offset:2px}
</style>
</helmet>
<div class="{{tc}}" style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column">
  <div style="padding:28px 16px 0;display:flex;flex-direction:column;gap:6px">
    <h1 class="h" style="margin:0;font-size:28px">Entregar</h1>
    <p style="margin:0;font-size:17px;color:var(--muted)">Pide el PIN al residente.</p>
  </div>
  <div style="padding:28px 16px 0;display:flex;justify-content:center;gap:12px">
    <sc-for list="{{cells}}" as="c" hint-placeholder-count="4">
      <span class="mono cell" style="{{c.st}}">{{c.v}}</span>
    </sc-for>
  </div>
  <sc-if value="{{listo}}" hint-placeholder-val="{{ false }}">
    <a href="Op-Cobrar.dc.html" style="margin:20px 16px 0;min-height:56px;border-radius:16px;background:var(--action);color:var(--on-action);display:flex;align-items:center;justify-content:center;font:700 18px 'Atkinson Hyperlegible Next',sans-serif;text-decoration:none">Ver paquetes de T2 · 304</a>
  </sc-if>
  <a href="#" style="margin:16px auto 0;min-height:48px;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;color:var(--pin);text-decoration:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2M18 14h2v2M14 18h2v2M18 18h2v2"/></svg>Escanear QR</a>
  <div style="flex:1"></div>
  <div style="padding:0 16px 12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
    <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
      <button class="key" type="button" onClick="{{k.tap}}" aria-label="{{k.label}}">{{k.v}}</button>
    </sc-for>
  </div>
  <nav style="display:flex;border-top:1px solid var(--line);background:var(--surface);padding:4px 8px 16px">
    <a class="tab" href="Op-Recibir.dc.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M3 8l9-5 9 5v10l-9 5-9-5zM3 8l9 5 9-5M12 13v10"/></svg>Recibir</a>
    <a class="tab" href="Op-Entregar.dc.html" aria-current="page" style="color:var(--action)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Entregar</a>
    <a class="tab" href="Op-Pendientes.dc.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Pendientes · 5</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["día","noche"],"default":"día"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pin: '48' }; }
  renderVals() {
    const pin = this.state.pin;
    const cells = [0, 1, 2, 3].map((i) => ({
      v: pin[i] || '',
      st: 'border:2px solid ' + (pin[i] ? 'var(--pin)' : (i === pin.length ? 'var(--action)' : 'var(--line)')) + ';background:var(--surface)'
    }));
    const add = (d) => () => { if (this.state.pin.length < 4) this.setState({ pin: this.state.pin + d }); };
    const keys = ['1','2','3','4','5','6','7','8','9'].map((d) => ({ v: d, label: d, tap: add(d) }));
    keys.push({ v: 'C', label: 'Limpiar', tap: () => this.setState({ pin: '' }) });
    keys.push({ v: '0', label: '0', tap: add('0') });
    keys.push({ v: '←', label: 'Borrar', tap: () => this.setState({ pin: this.state.pin.slice(0, -1) }) });
    return { tc: (this.props.tema ?? 'día') === 'noche' ? 'pt noche' : 'pt', cells, keys, listo: pin.length === 4 };
  }
}
</script>
</body>
</html>
