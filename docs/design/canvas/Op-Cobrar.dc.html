<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Operador · Entregar todo y cobrar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&amp;family=Atkinson+Hyperlegible+Next:wght@400;500;700;800&amp;family=IBM+Plex+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0}
.pt{--bg:#E9DFCC;--surface:#FBF8F1;--raised:#F3ECDD;--line:#CDBFA5;--ink:#13294B;--muted:#5B5446;--action:#1F4FD1;--on-action:#FFFFFF;--edge:#13294B;--pin:#0B6E75;--wa:#0F7A40;--on-wa:#FFFFFF;--gift:#C2410C;--warn:#8A5A00;--danger:#B42318;font-family:'Atkinson Hyperlegible Next',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.pt.noche{--bg:#15130F;--surface:#1F1C17;--raised:#2A261F;--line:#3E382E;--ink:#F3ECDD;--muted:#BDB3A0;--action:#7D97FF;--on-action:#0B1020;--edge:#000000;--pin:#4FD1C5;--wa:#25D366;--on-wa:#04210F;--gift:#FF8A5B;--warn:#F2B33D;--danger:#FF6B5B}
.h{font-family:Archivo,sans-serif;font-weight:800;letter-spacing:-0.02em}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.btn{box-sizing:border-box;min-height:56px;padding:0 20px;border-radius:16px;font:700 18px 'Atkinson Hyperlegible Next',sans-serif;border:0;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
.btn-p{background:var(--action);color:var(--on-action);box-shadow:0 4px 0 var(--edge)}
.pk{display:flex;align-items:center;gap:14px;padding:12px;border-radius:16px;background:var(--surface)}
.seg{flex:1;min-height:52px;border-radius:12px;border:0;font:700 17px 'Atkinson Hyperlegible Next',sans-serif;cursor:pointer}
a:focus-visible,button:focus-visible{outline:2px solid var(--action);outline-offset:2px}
</style>
</helmet>
<div class="{{tc}}" style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;gap:8px;padding:12px 8px 0">
    <a href="Op-Entregar.dc.html" aria-label="Volver" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:var(--ink)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <span style="display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:700;color:var(--pin)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>PIN correcto</span>
  </div>
  <div style="padding:12px 16px 0;display:flex;flex-direction:column;gap:4px">
    <h1 class="h" style="margin:0;font-size:28px"><span class="mono">T2 · 304</span></h1>
    <p style="margin:0;font-size:17px;color:var(--muted)">Ana Gómez · 2 paquetes</p>
  </div>
  <div style="padding:16px 16px 0;display:flex;flex-direction:column;gap:8px">
    <div class="pk">
      <div style="width:56px;height:56px;border-radius:12px;background:var(--line);flex:none"></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:17px;font-weight:700">Estándar</span><span style="font-size:15px;color:var(--muted)">Servientrega · hoy 10:42</span></div>
      <span style="font-size:15px;font-weight:700;color:var(--gift)">Gratis</span>
    </div>
    <div class="pk">
      <div style="width:56px;height:56px;border-radius:12px;background:var(--line);flex:none"></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:17px;font-weight:700">Volumen</span><span style="font-size:15px;color:var(--muted)">Mercado Libre · ayer 4:15</span></div>
      <span class="mono" style="font-size:18px;font-weight:700">$5.000</span>
    </div>
  </div>
  <div style="margin:16px 16px 0;padding:16px;border-radius:16px;background:var(--raised);display:flex;align-items:center;justify-content:space-between">
    <span style="font-size:17px;font-weight:700">Total a cobrar</span>
    <span class="mono" style="font-size:28px;font-weight:700">$5.000</span>
  </div>
  <div role="radiogroup" aria-label="Forma de pago" style="margin:12px 16px 0;padding:4px;border-radius:14px;background:var(--surface);display:flex;gap:4px">
    <button type="button" role="radio" class="seg" aria-checked="{{efOn}}" style="{{efSt}}" onClick="{{pickEf}}">Efectivo</button>
    <button type="button" role="radio" class="seg" aria-checked="{{trOn}}" style="{{trSt}}" onClick="{{pickTr}}">Transferencia</button>
  </div>
  <p style="margin:10px 16px 0;font-size:14px;color:var(--muted)">Montos <b style="color:var(--warn)">DEMO</b>. La tarifa sale del conjunto.</p>
  <div style="flex:1"></div>
  <div style="padding:12px 16px 28px">
    <a class="btn btn-p" href="Op-Recibir.dc.html">Entregar todo</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["día","noche"],"default":"día"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pago: 'ef' }; }
  renderVals() {
    const on = 'background:var(--raised);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)';
    const off = 'background:transparent;color:var(--muted)';
    const ef = this.state.pago === 'ef';
    return {
      tc: (this.props.tema ?? 'día') === 'noche' ? 'pt noche' : 'pt',
      efOn: ef ? 'true' : 'false', trOn: ef ? 'false' : 'true',
      efSt: ef ? on : off, trSt: ef ? off : on,
      pickEf: () => this.setState({ pago: 'ef' }), pickTr: () => this.setState({ pago: 'tr' })
    };
  }
}
</script>
</body>
</html>
