<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Operador · Tamaño y foto</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&amp;family=Atkinson+Hyperlegible+Next:wght@400;500;700;800&amp;family=IBM+Plex+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0}
.pt{--bg:#E9DFCC;--surface:#FBF8F1;--raised:#F3ECDD;--line:#CDBFA5;--ink:#13294B;--muted:#5B5446;--action:#1F4FD1;--on-action:#FFFFFF;--edge:#13294B;--pin:#0B6E75;--wa:#0F7A40;--on-wa:#FFFFFF;--gift:#C2410C;--warn:#8A5A00;--danger:#B42318;font-family:'Atkinson Hyperlegible Next',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.pt.noche{--bg:#15130F;--surface:#1F1C17;--raised:#2A261F;--line:#3E382E;--ink:#F3ECDD;--muted:#BDB3A0;--action:#7D97FF;--on-action:#0B1020;--edge:#000000;--pin:#4FD1C5;--wa:#25D366;--on-wa:#04210F;--gift:#FF8A5B;--warn:#F2B33D;--danger:#FF6B5B}
.h{font-family:Archivo,sans-serif;font-weight:800;letter-spacing:-0.02em}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.btn{box-sizing:border-box;min-height:56px;padding:0 20px;border-radius:16px;font:700 18px 'Atkinson Hyperlegible Next',sans-serif;border:0;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
.btn-p{background:var(--action);color:var(--on-action);box-shadow:0 4px 0 var(--edge)}
.tile{box-sizing:border-box;min-height:112px;border-radius:18px;background:var(--surface);color:var(--ink);border:2px solid var(--line);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:14px;text-align:left;font-family:'Atkinson Hyperlegible Next',sans-serif;cursor:pointer}
.tile.on{border-color:var(--action);background:var(--raised)}
a:focus-visible,button:focus-visible{outline:2px solid var(--action);outline-offset:2px}
</style>
</helmet>
<div class="{{tc}}" style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;gap:8px;padding:12px 8px 0">
    <a href="Op-Recibir.dc.html" aria-label="Volver" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:var(--ink)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <div style="display:flex;flex-direction:column">
      <span class="mono" style="font-size:20px;font-weight:700">T2 · 304</span>
      <span style="font-size:15px;color:var(--muted)">Ana Gómez</span>
    </div>
  </div>
  <div style="padding:16px 16px 0;display:flex;flex-direction:column;gap:10px">
    <h1 class="h" style="margin:0;font-size:26px">¿Qué tamaño tiene?</h1>
    <span style="align-self:flex-start;display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 12px;border-radius:999px;background:var(--raised);color:var(--gift);font-weight:700;font-size:14px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M4 11h16v9H4zM12 11v9M3 7h18v4H3z"/></svg>Primera entrega gratis</span>
  </div>
  <div style="padding:14px 16px 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
    <sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
      <button type="button" class="{{t.cls}}" onClick="{{t.pick}}" aria-pressed="{{t.on}}">
        <span style="font-size:19px;font-weight:800">{{t.nombre}}</span>
        <span style="font-size:14px;color:var(--muted)">{{t.ayuda}}</span>
        <span class="mono" style="font-size:20px;font-weight:700">{{t.precio}}</span>
      </button>
    </sc-for>
  </div>
  <p style="margin:8px 16px 0;font-size:14px;color:var(--muted)">Tarifas del conjunto · <b style="color:var(--warn)">DEMO</b></p>
  <div style="padding:16px 16px 0;display:flex;gap:10px">
    <button type="button" style="flex:1;min-height:88px;border-radius:16px;border:2px dashed var(--line);background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:10px;font:700 17px 'Atkinson Hyperlegible Next',sans-serif">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Tomar foto
    </button>
    <button type="button" style="width:120px;min-height:88px;border-radius:16px;border:2px dashed var(--line);background:transparent;color:var(--muted);font:700 15px 'Atkinson Hyperlegible Next',sans-serif">+ Guía</button>
  </div>
  <p style="margin:8px 16px 0;font-size:14px;color:var(--muted)">Foto y guía son opcionales.</p>
  <div style="flex:1"></div>
  <div style="padding:12px 16px 28px">
    <a class="btn btn-p" href="Op-Guardado.dc.html">Guardar</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["día","noche"],"default":"día"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: 'est' }; }
  renderVals() {
    const base = [
      { id: 'mano', nombre: 'Mano', ayuda: 'Sobre o bolsa', precio: '$2.000' },
      { id: 'est', nombre: 'Estándar', ayuda: 'Caja de zapatos', precio: '$3.000' },
      { id: 'vol', nombre: 'Volumen', ayuda: 'Caja grande', precio: '$5.000' },
      { id: 'pes', nombre: 'Pesado', ayuda: 'Más de 10 kg', precio: '$8.000' }
    ];
    const tiles = base.map((t) => ({ ...t, on: this.state.sel === t.id ? 'true' : 'false', cls: this.state.sel === t.id ? 'tile on' : 'tile', pick: () => this.setState({ sel: t.id }) }));
    return { tc: (this.props.tema ?? 'día') === 'noche' ? 'pt noche' : 'pt', tiles };
  }
}
</script>
</body>
</html>
