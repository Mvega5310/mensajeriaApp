<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover habilita env(safe-area-inset-*) en iPhones con
       notch/home-indicator -- lo necesita la barra de pestañas fija abajo. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Puertayá</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#1E63C9">
  <!-- Safari no lee el manifest para esto — sin estas etiquetas, "Agregar
       a inicio" no oculta la barra de Safari ni usa el ícono correcto. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Puertaya">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Atkinson+Hyperlegible+Next:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500;700&display=swap">
  <script>
    // Aplica el tema antes de pintar (evita el parpadeo): el guardado o, si no
    // hay, el del teléfono. useTheme mantiene después estos mismos atributos.
    try {
      var t = localStorage.getItem('puertaya-tema');
      if (t !== 'dia' && t !== 'noche') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'noche' : 'dia';
      document.documentElement.setAttribute('data-tema', t);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
